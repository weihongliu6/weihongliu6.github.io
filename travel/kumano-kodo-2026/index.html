<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Private itinerary · 私人行程</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #f6f1e7; background: radial-gradient(circle at 50% 0%, #24483d 0, #102a24 38%, #071713 100%); }
      main { width: min(620px, 100%); padding: clamp(32px, 7vw, 56px); border: 1px solid rgba(232, 196, 126, .35); border-radius: 24px; background: rgba(7, 23, 19, .82); box-shadow: 0 28px 80px rgba(0, 0, 0, .35); text-align: center; }
      .lock { width: 56px; height: 56px; display: grid; place-items: center; margin: 0 auto 22px; border-radius: 50%; background: #e8c47e; color: #17342c; font-size: 26px; }
      h1 { margin: 0 0 12px; font-family: Georgia, "Noto Serif SC", serif; font-size: clamp(32px, 7vw, 46px); font-weight: 500; }
      .en { margin: 0 0 24px; color: #e8c47e; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; }
      p { margin: 10px 0; color: #d8ded9; line-height: 1.75; }
      .access-button { display: inline-flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 10px; max-width: 100%; min-height: 52px; margin-top: 22px; padding: 16px 22px; border: 1px solid #e8c47e; border-radius: 12px; background: #e8c47e; color: #102a24; font-size: 16px; font-weight: 700; line-height: 1.5; text-decoration: none; }
      .access-button:hover { background: #f3d79f; border-color: #f3d79f; }
      .access-button:focus-visible { outline: 3px solid #f6f1e7; outline-offset: 5px; }
      .access-button [lang="en"] { font-size: 14px; letter-spacing: .04em; }
      footer { margin-top: 28px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.12); color: #9fb0aa; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <div class="lock" aria-hidden="true">&#128274;</div>
      <h1>此行程现为私人内容</h1>
      <div class="en">Private itinerary</div>
      <p>旅行资料已移至受保护的网站，仅获准成员可通过邀请邮箱登录查看。</p>
      <p>This itinerary has moved to a protected site. Approved members can sign in using their invited email address.</p>
      <a class="access-button" href="https://kumano-kodo-2026-private.weihongliu.chatgpt.site"><span>进入私人行程</span><span aria-hidden="true">/</span><span lang="en">ACCESS PRIVATE ITINERARY</span></a>
      <footer>Access is limited to the travel group · 仅限同行成员访问</footer>
    </main>
  </body>
</html>
