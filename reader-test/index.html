<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src blob:; connect-src https://vyhhzhayloesxvosbwtc.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>作者阅读测试 · 慢下来看见世界</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.mjs"></script>
</head>
<body>
<a class="skip" href="#content">跳到正文</a>
<header><span class="brand">慢下来，看见世界</span><span class="eyebrow">作者专用 · 非商业阅读测试</span><button id="logout" hidden>退出</button></header>
<main>
<section id="login-panel" class="welcome">
<p class="eyebrow">PRIVATE READING TEST</p>
<h1>让阅读，慢下来。</h1>
<p>这是作者本人使用的完整书稿测试页，仅限已授权账号。这里不开放注册或购买。</p>
<form id="login-form"><label for="email">作者邮箱</label><input id="email" type="email" autocomplete="email" required placeholder="输入已授权邮箱"><button type="submit" id="login">发送登录链接</button></form>
<p class="note">使用邮箱中的一次性登录链接，不需要在此输入密码。登录状态仅保存在当前页面内存中，刷新或离开后需要重新登录。</p>
</section>
<p id="status" role="status" aria-live="polite"></p>
<section id="reader" hidden>
<div class="intro-actions"><button id="start">从第一章开始</button><button id="resume" hidden>继续上次阅读</button><button id="reset">清除此测试的阅读位置</button></div>
<div class="layout">
<aside><details id="toc-panel" open><summary>全书目录 <span>22 个条目</span></summary><ol id="toc"></ol></details></aside>
<div><div class="toolbar"><span id="position"></span><div><button id="smaller" aria-label="减小字号">A−</button><button id="larger" aria-label="增大字号">A＋</button></div></div>
<article id="content" tabindex="-1"></article>
<nav class="chapter-nav" aria-label="章节导航"><button id="previous" disabled>上一节</button><button id="next" disabled>下一节</button></nav>
</div></div>
</section>
</main>
<footer>仅在线读取授权内容，不提供离线下载。此设备只保存章节与阅读位置。退出会清空页面内容，但已显示或被另行保存的内容无法远程收回。</footer>
</body></html>
