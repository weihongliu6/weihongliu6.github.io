<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>临床思考 | Clinical Insights</title>

  <style>
    :root{
      --text:#111;
      --muted:#5a5a5a;
      --card:#fff;
      --border:rgba(0,0,0,.08);
      --shadow:0 10px 28px rgba(0,0,0,.07);
      --radius:16px;
      --wrap:920px;
    }

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        linear-gradient(rgba(255,255,255,0.78), rgba(255,255,255,0.86)),
        url("images/background.jpg");
      background-size:cover;
      background-position:center;
      background-attachment:fixed;
    }

    @media (max-width: 820px){
      body{ background-attachment:scroll; }
    }

    .wrap{
      max-width:var(--wrap);
      margin:0 auto;
      padding:24px 16px 40px;
    }

    .back-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }

    .back{
      display:inline-block;
      text-decoration:none;
      color:#333;
      border:1px solid var(--border);
      background:rgba(255,255,255,.82);
      border-radius:999px;
      padding:8px 14px;
      font-size:14px;
    }

    .back:hover{ background:#fff; }

    h1{
      margin:8px 0 6px;
      font-size:clamp(30px,4.2vw,42px);
      font-weight:500;
      letter-spacing:1.2px;
      text-align:center;
    }

    .title-en{
      margin:0;
      color:#6b6b6b;
      text-align:center;
      font-size:clamp(16px,2.4vw,20px);
      letter-spacing:.4px;
    }

    .rule{
      width:110px;
      height:1px;
      background:rgba(0,0,0,.28);
      margin:18px auto 20px;
    }

    .article-list{
      margin-top:20px;
      background:rgba(255,255,255,.78);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:18px 18px 14px;
    }

    .article-list h2{
      margin:0;
      font-size:22px;
      font-weight:500;
      line-height:1.3;
      color:#1f1f1f;
    }

    .article-list .subtitle{
      margin:4px 0 12px;
      color:#6b6b6b;
      font-size:14px;
    }

    .article-list ul{
      margin:0;
      padding:0;
      list-style:none;
    }

    .article-list li{
      margin:0;
      padding:10px 0;
      border-top:1px solid rgba(0,0,0,.06);
    }

    .article-list a{
      text-decoration:none;
      color:inherit;
      display:block;
      line-height:1.55;
    }

    .article-list .zh{
      display:block;
      font-size:17px;
      color:#1f1f1f;
    }

    .article-list .en{
      display:block;
      margin-top:2px;
      font-size:14px;
      color:#666;
    }

    .article-list a:hover .zh{
      text-decoration:underline;
      text-underline-offset:3px;
    }

    footer{
      margin-top:26px;
      text-align:center;
      color:#777;
      font-size:13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="back-row">
      <a class="back" href="index.html">← 返回主页</a>
      <a class="back" href="medical.html">← 返回医学栏目</a>
    </div>

    <h1>临床思考</h1>
    <p class="title-en">Clinical Insights</p>
    <div class="rule"></div>

    <section class="article-list">
      <h2>文章列表</h2>
      <p class="subtitle">Article List</p>
      <ul>
        <li>
          <a href="medical/osa-clinical-insights.html">
            <span class="zh">睡梦中的“隐形杀手”：你可能对阻塞性睡眠呼吸暂停的认知已经过时了</span>
            <span class="en">Outdated Understanding of OSA: A Clinical Insight</span>
          </a>
        </li>
        <li>
          <a href="medical.html" aria-disabled="true">
            <span class="zh">更多文章即将发布</span>
            <span class="en">New article coming soon</span>
          </a>
        </li>
      </ul>
    </section>

    <footer>© Dr Weihong Liu · Digital Studio</footer>
  </div>
</body>
</html>
