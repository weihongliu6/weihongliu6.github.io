name: Publish AI Brief

on:
  # GitHub Actions cron uses UTC; 19:35 UTC is about 6:05 AM Adelaide during daylight saving.
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found; skipping dependency installation."
          fi

      - name: Capture workflow date (UTC)
        run: echo "BRIEF_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Debug workflow context and pre-run file state
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "BRIEF_DATE=$BRIEF_DATE"
          if [ -f "ai-briefs/AI_Brief_${BRIEF_DATE}.html" ]; then
            echo "Before run: ai-briefs/AI_Brief_${BRIEF_DATE}.html exists"
          else
            echo "Before run: ai-briefs/AI_Brief_${BRIEF_DATE}.html is missing"
          fi

      - name: Ensure today's daily brief file exists
        run: python youtube_search.py "$BRIEF_DATE" --ensure-daily

      - name: Debug post-ensure file state
        run: |
          if [ -f "ai-briefs/AI_Brief_${BRIEF_DATE}.html" ]; then
            echo "After --ensure-daily: ai-briefs/AI_Brief_${BRIEF_DATE}.html exists"
          else
            echo "After --ensure-daily: ai-briefs/AI_Brief_${BRIEF_DATE}.html is missing"
          fi
          ls -la ai-briefs/

      - name: Rebuild brief archive index
        run: python youtube_search.py "$BRIEF_DATE"

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git add ai-briefs/index.html
          git add ai-briefs/AI_Brief_*.html 2>/dev/null || true
          git commit -m "Publish AI brief $(date -u +%F)"
          git push origin main
