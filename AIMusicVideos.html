<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 音乐视频</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      background: #0f0f10;
      color: #f4f4f5;
    }

    .wrap {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    h1 {
      font-size: 1.4rem;
      margin: 0 0 14px;
      font-weight: 700;
    }

    .section-title {
      font-size: 1rem;
      margin: 0 0 10px;
      font-weight: 600;
      color: #e7e8eb;
    }

    .cards {
      display: grid;
      gap: 12px;
    }

    .card {
      padding: 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .link-entry {
      display: block;
      text-decoration: none;
      color: inherit;
      border-radius: 10px;
      transition: transform .2s ease, background .2s ease;
    }

    .link-entry:hover,
    .link-entry:focus-visible {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.08);
    }

    .link-entry small {
      color: #c9ccd1;
      display: block;
      margin-top: 4px;
    }

    .card h2 {
      margin: 0;
      font-size: 1.06rem;
      line-height: 1.4;
    }

    .card p {
      margin: 10px 0 0;
      color: #c9ccd1;
      line-height: 1.7;
      font-size: .95rem;
    }

    .card-action {
      display: inline-block;
      margin-top: 12px;
      text-decoration: none;
      color: #f4f4f5;
      border-bottom: 1px solid rgba(244, 244, 245, 0.45);
      padding-bottom: 2px;
      font-size: .95rem;
      transition: opacity .2s ease;
    }

    .card-action:hover,
    .card-action:focus-visible {
      opacity: .85;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>AI 音乐视频</h1>
    <h2 class="section-title">作品列表 · Works List</h2>

    <section class="cards" aria-label="Works and Player Cards">
      <article class="card">
        <h2>音乐播放器<br>Music Player</h2>
        <p>在这里进入独立音乐播放器页面，集中播放与整理原创作品。</p>
        <p>Enter the standalone music player page for original songs and listening sessions.</p>
        <a class="card-action" href="music-player.html">打开音乐播放器 · Open Music Player</a>
      </article>
    </section>
  </main>
</body>
</html>
