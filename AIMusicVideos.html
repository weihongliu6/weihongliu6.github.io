<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 音乐视频</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      background: #0f0f10;
      color: #f4f4f5;
    }

    .wrap {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    h1 {
      font-size: 1.4rem;
      margin: 0 0 14px;
      font-weight: 700;
    }

    .link-entry {
      display: block;
      text-decoration: none;
      color: inherit;
      padding: 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform .2s ease, background .2s ease;
    }

    .link-entry:hover,
    .link-entry:focus-visible {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.08);
    }

    .link-entry small {
      color: #c9ccd1;
      display: block;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>AI 音乐视频</h1>
    <a class="link-entry" href="music-player.html">
      音乐播放器（移动端优先）
      <small>影子观察 · 影院感音乐页</small>
    </a>
  </main>
</body>
</html>
