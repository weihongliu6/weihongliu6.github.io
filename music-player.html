<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>影子观察 · 音乐播放器</title>
  <style>
    :root {
      --bg: #090705;
      --card: rgba(35, 26, 20, 0.58);
      --card-stroke: rgba(255, 210, 170, 0.2);
      --text: #f8efe7;
      --muted: #ccb8a6;
      --accent: #f3a15f;
      --accent-soft: rgba(243, 161, 95, 0.3);
      --track: rgba(255, 255, 255, 0.14);
      --danger: #ff826e;
      --shadow: 0 20px 48px rgba(0, 0, 0, 0.45);
      --radius-lg: 28px;
      --radius-md: 20px;
      --radius-sm: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      background-image: url('music/cover-adelaide.jpg');
      background-size: cover;
      background-position: center;
      filter: blur(48px) saturate(1.25) brightness(0.7);
      transform: scale(1.14);
      z-index: -3;
      transition: background-image 0.5s ease;
    }

    .bg-vignette {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top, rgba(250, 154, 71, 0.24), transparent 45%),
        linear-gradient(to bottom, rgba(8, 6, 5, 0.25), rgba(8, 6, 5, 0.86));
      z-index: -2;
    }

    .page {
      width: min(100%, 420px);
      margin: 0 auto;
      padding: clamp(14px, 4vw, 20px) clamp(16px, 4.5vw, 24px) calc(28px + env(safe-area-inset-bottom));
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #f4dcc7;
      text-decoration: none;
      font-size: 0.92rem;
      opacity: 0.92;
      margin: 8px 0 14px;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .back-link:hover,
    .back-link:focus-visible {
      opacity: 1;
      transform: translateX(-1px);
    }

    .player-card {
      background: var(--card);
      border: 1px solid var(--card-stroke);
      border-radius: var(--radius-lg);
      padding: clamp(16px, 4.2vw, 24px);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 16px;
    }

    .brand small {
      color: var(--muted);
      letter-spacing: 0.02em;
      font-size: 0.76rem;
    }

    .brand strong {
      font-size: 1.02rem;
      font-weight: 600;
    }

    .cover-wrap {
      position: relative;
      width: min(100%, 340px);
      margin: 0 auto;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.45);
      aspect-ratio: 1 / 1;
      background: #2f241c;
    }

    .cover-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(8, 6, 5, 0.72) 4%, rgba(8, 6, 5, 0.44) 26%, rgba(8, 6, 5, 0) 52%);
      pointer-events: none;
      z-index: 1;
    }

    .cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .cover-overlay {
      position: absolute;
      left: 50%;
      bottom: clamp(14px, 5vw, 22px);
      transform: translateX(-50%);
      width: min(88%, 280px);
      text-align: center;
      z-index: 2;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.58);
    }

    .cover-album-title-cn {
      margin: 0;
      font-size: clamp(1.05rem, 4.1vw, 1.3rem);
      line-height: 1.3;
      font-weight: 650;
      letter-spacing: 0.04em;
    }

    .cover-album-title-en {
      margin: 4px 0 0;
      font-size: 0.72rem;
      color: rgba(248, 239, 231, 0.82);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .cover-album-subtitle {
      margin: 4px 0 0;
      font-size: 0.68rem;
      color: rgba(236, 213, 192, 0.84);
      letter-spacing: 0.08em;
    }

    .cover-wrap:hover .cover {
      transform: scale(1.02);
    }

    .meta {
      text-align: center;
      margin: 16px auto 10px;
      max-width: 320px;
    }

    .song-meta {
      transition: opacity 0.24s ease;
    }

    .song-meta.fading {
      opacity: 0.62;
    }

    .song-title-cn {
      margin: 0;
      font-size: clamp(1.2rem, 4.8vw, 1.55rem);
      line-height: 1.32;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .song-title-en {
      margin: 6px 0 0;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .artist {
      margin: 8px 0 0;
      color: #f2c89f;
      font-size: 0.94rem;
      letter-spacing: 0.08em;
    }

    .progress-wrap {
      margin-top: 14px;
    }

    .progress {
      width: 100%;
      appearance: none;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--accent) var(--progress, 0%), var(--track) var(--progress, 0%));
      outline: none;
      cursor: pointer;
    }

    .progress::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffd8b8;
      border: 2px solid rgba(70, 42, 24, 0.9);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
    }

    .progress::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: none;
      border-radius: 50%;
      background: #ffd8b8;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.02em;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 6.4vw, 28px);
      margin-top: 14px;
      margin-bottom: 4px;
    }

    .control-btn {
      border: none;
      cursor: pointer;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      width: 48px;
      height: 48px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s ease, background 0.2s ease;
      font-size: 1.24rem;
    }

    .control-btn:hover,
    .control-btn:focus-visible {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.12);
    }

    .control-btn:active {
      transform: scale(0.97);
    }

    .control-btn.play {
      width: 62px;
      height: 62px;
      background: linear-gradient(145deg, #ffd5aa, #e88c4c);
      color: #2f1b0d;
      box-shadow: 0 10px 20px rgba(232, 140, 76, 0.34);
      font-size: 1.34rem;
    }

    .error {
      min-height: 20px;
      text-align: center;
      color: var(--danger);
      font-size: 0.82rem;
      margin-top: 10px;
    }

    .lyrics-panel {
      --lyrics-focus-bias: 0px;
      margin-top: 12px;
      height: 184px;
      position: relative;
      overflow: hidden;
      text-align: center;
      border-radius: 16px;
      mask-image: linear-gradient(to bottom, transparent 0%, black 14%, black 86%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 14%, black 86%, transparent 100%);
    }

    .lyrics-viewport {
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    .lyrics-track {
      display: flex;
      flex-direction: column;
      transform: translateY(0);
      transition: transform 0.52s cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: transform;
    }

    .lyrics-track.pending-start .lyrics-line {
      opacity: 0;
      color: transparent;
      filter: none;
      text-shadow: none;
    }

    .lyrics-spacer {
      height: var(--lyrics-spacer, 88px);
      flex: 0 0 auto;
    }

    .lyrics-line {
      margin: 0;
      min-height: var(--lyric-line-height, 34px);
      padding: 4px 8px;
      color: rgba(248, 239, 231, 0.46);
      font-size: 0.95rem;
      line-height: var(--lyric-line-height, 34px);
      transition: color 0.4s ease, transform 0.4s ease, opacity 0.4s ease, filter 0.4s ease;
      opacity: 0.64;
      transform: scale(0.98);
      filter: blur(0.45px);
      will-change: transform, opacity, color;
    }

    .lyrics-line.active {
      color: #ffe9d3;
      opacity: 1;
      transform: scale(1.03);
      filter: blur(0);
      text-shadow: 0 0 14px rgba(255, 205, 160, 0.35);
      font-weight: 600;
    }

    .lyrics-empty {
      color: var(--muted);
      font-size: 0.9rem;
      opacity: 0.9;
      margin: 0;
      padding-top: 4px;
    }

    .playlist-viewport {
      --queue-visible: 4;
      --queue-gap: 9px;
      --queue-item-height: 58px;
      margin-top: 16px;
      position: relative;
      overflow: hidden;
      height: calc((var(--queue-item-height) * var(--queue-visible)) + (var(--queue-gap) * (var(--queue-visible) - 1)));
      mask-image: linear-gradient(to bottom, black 0%, black 88%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black 0%, black 88%, transparent 100%);
    }

    .playlist {
      display: grid;
      gap: var(--queue-gap);
      transform: translateY(0);
      transition: transform 0.46s cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: transform;
    }

    .playlist-item {
      display: grid;
      gap: 3px;
      width: 100%;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      min-height: var(--queue-item-height);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .playlist-item:hover,
    .playlist-item:focus-visible {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .playlist-item.active {
      background: rgba(243, 161, 95, 0.2);
      border-color: rgba(243, 161, 95, 0.48);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.22);
    }

    .playlist-cn {
      font-size: 0.94rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .playlist-en {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    @media (max-width: 759px) {
      .page {
        padding: 10px 14px calc(20px + env(safe-area-inset-bottom));
      }

      .back-link {
        margin: 4px 0 10px;
      }

      .player-card {
        padding: 14px;
        border-radius: 24px;
      }

      .brand {
        margin-bottom: 12px;
      }

      .cover-wrap {
        width: min(100%, 286px);
      }

      .meta {
        margin: 12px auto 8px;
      }

      .cover-overlay {
        bottom: 12px;
        width: min(90%, 250px);
      }

      .cover-album-title-cn {
        font-size: clamp(0.96rem, 3.9vw, 1.12rem);
      }

      .cover-album-title-en {
        margin-top: 3px;
        font-size: 0.67rem;
      }

      .cover-album-subtitle {
        font-size: 0.64rem;
      }

      .song-title-cn {
        font-size: clamp(1.12rem, 4.6vw, 1.32rem);
        line-height: 1.28;
      }

      .song-title-en {
        margin-top: 4px;
        font-size: 0.73rem;
      }

      .artist {
        margin-top: 6px;
        font-size: 0.88rem;
      }

      .progress-wrap {
        margin-top: 10px;
      }

      .time-row {
        margin-top: 6px;
        font-size: 0.74rem;
      }

      .controls {
        gap: 14px;
        margin-top: 10px;
        margin-bottom: 0;
      }

      .control-btn {
        width: 44px;
        height: 44px;
      }

      .control-btn.play {
        width: 56px;
        height: 56px;
      }

      .error {
        margin-top: 4px;
        min-height: 10px;
        line-height: 1.2;
      }

      .lyrics-panel {
        --lyrics-focus-bias: -30px;
        margin-top: 0;
        height: 124px;
        padding-top: 0;
        mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 88%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 88%, transparent 100%);
      }

      .lyrics-viewport {
        padding-top: 0;
      }

      .lyrics-line {
        font-size: 0.9rem;
        min-height: var(--lyric-line-height-mobile, 30px);
        line-height: var(--lyric-line-height-mobile, 30px);
      }

      .playlist-viewport {
        --queue-visible: 3;
        --queue-gap: 7px;
        --queue-item-height: 52px;
        margin-top: 8px;
        padding-right: 2px;
      }

      .playlist-item {
        gap: 2px;
        padding: 8px 10px;
      }

      .playlist-cn {
        font-size: 0.9rem;
      }

      .playlist-en {
        font-size: 0.68rem;
      }
    }

    @media (min-width: 760px) {
      .page {
        width: min(100%, 1000px);
        padding-top: 28px;
      }

      .player-card {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 26px;
        align-items: center;
      }

      .left-col {
        order: 1;
      }

      .right-col {
        order: 2;
      }

      .brand {
        margin-bottom: 18px;
      }

      .cover-wrap {
        width: min(100%, 410px);
      }

      .playlist-viewport {
        --queue-visible: 4;
        padding-right: 2px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-vignette"></div>

  <main class="page">
    <a class="back-link" href="index.html" aria-label="返回主页 Home">← 返回主页 Home</a>

    <section class="player-card" aria-label="音乐播放器">
      <div class="left-col">
        <div class="brand">
          <small>影子观察数字工作室</small>
          <strong>影院感音乐空间</strong>
        </div>

        <div class="cover-wrap">
          <!-- 替换封面图片：修改 songs 数组里的 cover 字段 -->
          <img id="coverImage" class="cover" src="music/cover-adelaide.jpg" alt="专辑封面" />
          <div class="cover-overlay" aria-label="专辑信息">
            <p class="cover-album-title-cn">阿德莱德的风</p>
            <p class="cover-album-title-en">THE WIND OF ADELAIDE</p>
            <p class="cover-album-subtitle">影子观察 · 数字音乐专辑</p>
          </div>
        </div>
      </div>

      <div class="right-col">
        <div class="meta">
          <div id="songMeta" class="song-meta">
            <!-- 替换歌曲标题：修改 songs 数组里的 titleCn / titleEn 字段 -->
            <h1 id="titleCn" class="song-title-cn">阿德莱德，一个我称之为家的地方</h1>
            <p id="titleEn" class="song-title-en">ADELAIDE A PLACE WE CALL HOME</p>
          </div>
          <p class="artist">影子观察</p>
        </div>

        <div class="progress-wrap">
          <input id="progress" class="progress" type="range" min="0" max="100" value="0" aria-label="播放进度" />
          <div class="time-row">
            <span id="currentTime">00:00</span>
            <span id="duration">--:--</span>
          </div>
        </div>

        <div class="controls">
          <button id="prevBtn" class="control-btn" type="button" aria-label="上一首">⏮</button>
          <button id="playBtn" class="control-btn play" type="button" aria-label="播放或暂停">▶</button>
          <button id="nextBtn" class="control-btn" type="button" aria-label="下一首">⏭</button>
        </div>

        <p id="errorMessage" class="error" role="status" aria-live="polite"></p>

        <div id="lyricsPanel" class="lyrics-panel" aria-live="polite" aria-label="歌词区域"><div id="lyricsViewport" class="lyrics-viewport"></div></div>

        <div class="playlist-viewport" aria-label="播放列表">
          <div id="playlist" class="playlist"></div>
        </div>
      </div>
    </section>

    <audio id="audio" preload="metadata"></audio>
  </main>

  <script>
    // 在这里维护歌曲清单（文件名、封面图、标题）
    const songs = [
      {
        titleCn: '阿德莱德，一个我称之为家的地方',
        titleEn: 'ADELAIDE A PLACE WE CALL HOME',
        artist: '影子观察',
        // 替换音频文件：把 src 改为你的文件路径
        src: 'music/song1.mp3',
        lrc: 'music/song1.lrc',
        // 替换封面图片：每首歌可使用不同封面
        cover: 'music/cover-adelaide.jpg'
      },
      {
        titleCn: '跨越万水千山',
        titleEn: 'ACROSS MOUNTAINS AND OCEANS',
        artist: '影子观察',
        src: 'music/song2.mp3',
        lrc: 'music/song2.lrc',
        cover: 'music/cover-adelaide.jpg'
      },
      {
        titleCn: '阿德莱德的风',
        titleEn: 'THE WIND OF ADELAIDE',
        artist: '影子观察',
        src: 'music/song3.mp3',
        lrc: 'music/song3.lrc',
        cover: 'music/cover-adelaide.jpg'
      },
      {
        titleCn: '在南澳',
        titleEn: 'In South Australia',
        artist: '影子观察',
        src: 'music/song4.mp3',
        lrc: null,
        cover: 'music/cover-adelaide.jpg'
      }
    ];

    const audio = document.getElementById('audio');
    const bgLayer = document.getElementById('bgLayer');
    const coverImage = document.getElementById('coverImage');
    const titleCnEl = document.getElementById('titleCn');
    const titleEnEl = document.getElementById('titleEn');
    const songMetaEl = document.getElementById('songMeta');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const errorMessage = document.getElementById('errorMessage');
    const playlist = document.getElementById('playlist');
    const lyricsPanel = document.getElementById('lyricsPanel');
    const lyricsViewport = document.getElementById('lyricsViewport');

    let currentIndex = 0;
    let userIsSeeking = false;
    let lyrics = [];
    let activeLyricIndex = -1;
    let lyricNodes = [];
    let lyricsTrack = null;
    let queueAnimationFrame = null;
    let isQueueAnimating = false;
    let queueTransitionHandler = null;

    function parseLrc(content) {
      return content
        .split('\n')
        .flatMap((line) => {
          const text = line.replace(/\[[^\]]+\]/g, '').trim();
          if (!text) return [];
          const times = [...line.matchAll(/\[(\d{2}):(\d{2}(?:\.\d{1,3})?)\]/g)];
          return times.map((match) => ({
            time: Number(match[1]) * 60 + Number(match[2]),
            text
          }));
        })
        .sort((a, b) => a.time - b.time);
    }

    function getLyricsFocusBias() {
      const value = getComputedStyle(lyricsPanel).getPropertyValue('--lyrics-focus-bias').trim();
      const parsed = Number.parseFloat(value);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function updateLyricsSpacer() {
      const lineHeight = lyricNodes[0]?.offsetHeight || 34;
      const focusBias = getLyricsFocusBias();
      const spacerHeight = Math.max(14, ((lyricsPanel.clientHeight / 2) - (lineHeight / 2)) + focusBias);
      lyricsPanel.style.setProperty('--lyrics-spacer', `${spacerHeight}px`);
    }

    function renderLyrics() {
      if (!lyrics.length) {
        lyricsViewport.innerHTML = '<p class="lyrics-empty">Lyrics coming soon</p>';
        lyricNodes = [];
        lyricsTrack = null;
        activeLyricIndex = -1;
        lyricsPanel.style.removeProperty('--lyrics-spacer');
        return;
      }

      lyricsViewport.innerHTML = `
        <div class="lyrics-track" id="lyricsTrack">
          <div class="lyrics-spacer" aria-hidden="true"></div>
          ${lyrics.map((line, index) => `<p class="lyrics-line" data-lyric-index="${index}">${line.text}</p>`).join('')}
          <div class="lyrics-spacer" aria-hidden="true"></div>
        </div>
      `;
      lyricsTrack = document.getElementById('lyricsTrack');
      lyricNodes = Array.from(lyricsViewport.querySelectorAll('.lyrics-line'));
      activeLyricIndex = -1;
      lyricsTrack.classList.add('pending-start');
      updateLyricsSpacer();
      if (lyricsTrack) {
        lyricsTrack.style.transform = 'translateY(0px)';
      }
    }

    function updateActiveLyric(timeInSeconds, force = false) {
      if (!lyrics.length || !lyricNodes.length || !lyricsTrack) return;

      let nextActiveIndex = -1;
      for (let i = 0; i < lyrics.length; i += 1) {
        if (timeInSeconds >= lyrics[i].time) {
          nextActiveIndex = i;
        } else {
          break;
        }
      }

      if (nextActiveIndex < 0) {
        if (activeLyricIndex >= 0) {
          lyricNodes[activeLyricIndex].classList.remove('active');
        }
        activeLyricIndex = -1;
        lyricsTrack.classList.add('pending-start');
        lyricsTrack.style.transform = 'translateY(0px)';
        return;
      }

      if (!force && nextActiveIndex === activeLyricIndex) return;

      if (activeLyricIndex >= 0) {
        lyricNodes[activeLyricIndex].classList.remove('active');
      }

      activeLyricIndex = nextActiveIndex;
      const activeNode = lyricNodes[activeLyricIndex];
      lyricsTrack.classList.remove('pending-start');
      activeNode.classList.add('active');

      const panelCenter = (lyricsPanel.clientHeight / 2) + getLyricsFocusBias();
      const activeCenter = activeNode.offsetTop + (activeNode.offsetHeight / 2);
      const targetTranslate = panelCenter - activeCenter;
      lyricsTrack.style.transform = `translateY(${targetTranslate}px)`;
    }

    function getLrcPath(song) {
      if ('lrc' in song) return song.lrc || null;
      const cleanSrc = song.src.split('?')[0].split('#')[0];
      return cleanSrc.replace(/\.[^.]+$/, '.lrc');
    }

    async function loadLyrics(song) {
      const lrcPath = getLrcPath(song);
      if (!lrcPath) {
        lyrics = [];
        renderLyrics();
        return;
      }

      try {
        const response = await fetch(lrcPath);
        if (!response.ok) throw new Error('LRC_NOT_FOUND');
        const text = await response.text();
        lyrics = parseLrc(text);
      } catch {
        lyrics = [];
      }

      renderLyrics();
    }

    function formatTime(timeInSeconds) {
      if (!Number.isFinite(timeInSeconds)) return '--:--';
      const total = Math.max(0, Math.floor(timeInSeconds));
      const minutes = String(Math.floor(total / 60)).padStart(2, '0');
      const seconds = String(total % 60).padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function renderPlaylist() {
      const queueSongs = songs.map((_, offset) => {
        const songIndex = (currentIndex + offset) % songs.length;
        return { song: songs[songIndex], songIndex };
      });

      playlist.innerHTML = queueSongs
        .map(({ song, songIndex }, queueIndex) => `
          <button
            class="playlist-item ${queueIndex === 0 ? 'active' : ''}"
            type="button"
            data-index="${songIndex}"
            data-queue-index="${queueIndex}"
            aria-label="切换到 ${song.titleCn}"
          >
            <span class="playlist-cn">${song.titleCn}</span>
            <span class="playlist-en">${song.titleEn}</span>
          </button>
        `)
        .join('');
      playlist.style.transform = 'translateY(0px)';
    }

    function getQueueStep() {
      const firstItem = playlist.querySelector('.playlist-item');
      if (!firstItem) return 0;
      const styles = getComputedStyle(playlist);
      const gap = Number.parseFloat(styles.rowGap || styles.gap || '0') || 0;
      return firstItem.offsetHeight + gap;
    }

    function clearQueueAnimation() {
      if (queueAnimationFrame !== null) {
        cancelAnimationFrame(queueAnimationFrame);
        queueAnimationFrame = null;
      }
      if (queueTransitionHandler) {
        playlist.removeEventListener('transitionend', queueTransitionHandler);
        queueTransitionHandler = null;
      }
      isQueueAnimating = false;
      playlist.style.transform = 'translateY(0px)';
    }

    function animateQueueAdvance(nextIndex, shouldAutoplay) {
      if (isQueueAnimating) return;
      const step = getQueueStep();
      if (!step) {
        setTrack(nextIndex, shouldAutoplay);
        return;
      }

      isQueueAnimating = true;
      playlist.style.transform = 'translateY(0px)';
      queueAnimationFrame = requestAnimationFrame(() => {
        playlist.style.transform = `translateY(-${step}px)`;
      });

      queueTransitionHandler = (event) => {
        if (event.propertyName !== 'transform') return;
        playlist.removeEventListener('transitionend', queueTransitionHandler);
        queueTransitionHandler = null;
        queueAnimationFrame = null;
        isQueueAnimating = false;
        setTrack(nextIndex, shouldAutoplay);
      };
      playlist.addEventListener('transitionend', queueTransitionHandler);
    }

    function syncProgressUI() {
      const ratio = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      progress.value = Number.isFinite(ratio) ? ratio : 0;
      progress.style.setProperty('--progress', `${progress.value}%`);
      currentTimeEl.textContent = formatTime(audio.currentTime);
    }

    function setTrack(index, shouldAutoplay = false) {
      clearQueueAnimation();
      currentIndex = (index + songs.length) % songs.length;
      const song = songs[currentIndex];

      songMetaEl.classList.add('fading');
      setTimeout(() => {
        songMetaEl.classList.remove('fading');
      }, 180);
      titleCnEl.textContent = song.titleCn;
      titleEnEl.textContent = song.titleEn;
      coverImage.src = song.cover;
      bgLayer.style.backgroundImage = `url('${song.cover}')`;

      audio.src = song.src;
      audio.load();

      currentTimeEl.textContent = '00:00';
      durationEl.textContent = '--:--';
      progress.value = 0;
      progress.style.setProperty('--progress', '0%');
      errorMessage.textContent = '';
      lyrics = [];
      renderLyrics();
      loadLyrics(song);

      renderPlaylist();

      if (shouldAutoplay) {
        audio.play().then(() => {
          playBtn.textContent = '⏸';
        }).catch(() => {
          playBtn.textContent = '▶';
        });
      } else {
        playBtn.textContent = '▶';
      }
    }

    playBtn.addEventListener('click', async () => {
      if (!audio.src) return;
      if (audio.paused) {
        try {
          await audio.play();
          playBtn.textContent = '⏸';
          errorMessage.textContent = '';
        } catch {
          errorMessage.textContent = '无法自动播放，请再次点击播放。';
        }
      } else {
        audio.pause();
        playBtn.textContent = '▶';
      }
    });

    prevBtn.addEventListener('click', () => {
      setTrack(currentIndex - 1, !audio.paused);
    });

    nextBtn.addEventListener('click', () => {
      animateQueueAdvance(currentIndex + 1, !audio.paused);
    });

    progress.addEventListener('input', () => {
      userIsSeeking = true;
      progress.style.setProperty('--progress', `${progress.value}%`);
      if (audio.duration) {
        currentTimeEl.textContent = formatTime((progress.value / 100) * audio.duration);
      }
    });

    progress.addEventListener('change', () => {
      if (audio.duration) {
        audio.currentTime = (progress.value / 100) * audio.duration;
        updateActiveLyric(audio.currentTime, true);
      }
      userIsSeeking = false;
    });

    playlist.addEventListener('click', (event) => {
      const target = event.target.closest('.playlist-item');
      if (!target) return;
      const nextIndex = Number(target.dataset.index);
      const queueIndex = Number(target.dataset.queueIndex);
      if (!Number.isInteger(nextIndex)) return;
      if (queueIndex === 1) {
        animateQueueAdvance(nextIndex, true);
        return;
      }
      setTrack(nextIndex, true);
    });

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
      syncProgressUI();
    });

    audio.addEventListener('timeupdate', () => {
      if (!userIsSeeking) {
        syncProgressUI();
      }
      updateActiveLyric(audio.currentTime);
    });

    audio.addEventListener('ended', () => {
      animateQueueAdvance(currentIndex + 1, true);
    });

    audio.addEventListener('play', () => {
      playBtn.textContent = '⏸';
    });

    audio.addEventListener('pause', () => {
      playBtn.textContent = '▶';
    });

    window.addEventListener('resize', () => {
      if (!lyricNodes.length) return;
      updateLyricsSpacer();
      updateActiveLyric(audio.currentTime, true);
    });

    audio.addEventListener('error', () => {
      errorMessage.textContent = '音频文件未找到或无法加载，请检查 /music/ 文件夹中的文件。';
      playBtn.textContent = '▶';
      durationEl.textContent = '--:--';
    });

    setTrack(0, false);
  </script>
</body>
</html>
